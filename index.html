<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>eDNA Bingo</title>
</head>
<body>
<style>
  /* Layout: single centred column, 4x4 tap grid, fixed card shared by everyone */
  :root {
    --bg: #eef4f3;
    --fg: #16302c;
    --card: #ffffff;
    --line: #c7d8d4;
    --accent: #0d7a69;
    --accent-fg: #ffffff;
    --muted: #58706b;
    --mark-fg: #ffffff;
    --cat0: #0d7a69; --cat1: #a1620b; --cat2: #2b5fa8;
    --cat3: #6d4fa3; --cat4: #b04a3c; --cat5: #a83e78;
    --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --font-body: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1715; --fg: #e3eeeb; --card: #16211f; --line: #2b3b37;
      --accent: #2fbfa4; --accent-fg: #052019; --muted: #91a8a2;
      --mark-fg: #0d1715;
      --cat0: #2fbfa4; --cat1: #e0a44e; --cat2: #74a9ea;
      --cat3: #b393e3; --cat4: #e68a74; --cat5: #e07ab8;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1715; --fg: #e3eeeb; --card: #16211f; --line: #2b3b37;
    --accent: #2fbfa4; --accent-fg: #052019; --muted: #91a8a2;
    --mark-fg: #0d1715;
    --cat0: #2fbfa4; --cat1: #e0a44e; --cat2: #74a9ea;
    --cat3: #b393e3; --cat4: #e68a74; --cat5: #e07ab8;
    color-scheme: dark;
  }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); }
  .wrap {
    max-width: 560px;
    margin-inline: auto;
    padding-block: 28px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 18px;
  }
  h1 {
    font-family: var(--font-display);
    font-size: clamp(28px, 7vw, 36px);
    font-weight: 700; letter-spacing: -0.01em;
    margin: 0 0 6px; text-wrap: balance;
  }
  .lede { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.45; }
  .lede strong { color: var(--fg); }

  .brand { display: flex; align-items: flex-start; gap: 14px; }
  .logo {
    width: 64px; height: 64px; flex: none; box-sizing: border-box;
    object-fit: contain; background: #ffffff; border-radius: 12px; padding: 7px;
    border: 1px solid var(--line);
  }

  .status { display: flex; flex-direction: column; gap: 6px; }
  .bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .fill { height: 100%; width: 0%; background: var(--accent); border-radius: 4px; transition: width 0.25s ease; }
  .count { margin: 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
  .cell {
    appearance: none; border: 1px solid var(--line); border-top-width: 3px; border-radius: 8px;
    background: var(--card); color: var(--fg);
    font-family: var(--font-body); font-size: clamp(11px, 2.9vw, 13px); line-height: 1.25;
    min-height: 76px; padding: 6px;
    display: flex; align-items: center; justify-content: center; text-align: center;
    overflow-wrap: anywhere; cursor: pointer; touch-action: manipulation;
    position: relative; transition: background 0.12s ease, color 0.12s ease;
  }
  .cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .c0 { border-top-color: var(--cat0); } .c1 { border-top-color: var(--cat1); }
  .c2 { border-top-color: var(--cat2); } .c3 { border-top-color: var(--cat3); }
  .c4 { border-top-color: var(--cat4); } .c5 { border-top-color: var(--cat5); }
  .cell[aria-pressed="true"] {
    color: var(--mark-fg); border-color: transparent; font-weight: 600;
  }
  .c0[aria-pressed="true"] { background: var(--cat0); }
  .c1[aria-pressed="true"] { background: var(--cat1); }
  .c2[aria-pressed="true"] { background: var(--cat2); }
  .c3[aria-pressed="true"] { background: var(--cat3); }
  .c4[aria-pressed="true"] { background: var(--cat4); }
  .c5[aria-pressed="true"] { background: var(--cat5); }
  .cell[aria-pressed="true"]::after {
    content: "✓"; position: absolute; top: 4px; right: 6px; font-size: 11px; opacity: 0.85;
  }

  .legend {
    display: flex; flex-wrap: wrap; gap: 6px 14px;
    margin: 0; padding: 0; list-style: none;
    font-size: 12px; color: var(--muted);
  }
  .legend li { display: flex; align-items: center; gap: 6px; }
  .legend .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }

  .foot { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  .reset {
    appearance: none; border: none; background: none; padding: 0;
    color: var(--accent); font: inherit; text-decoration: underline; cursor: pointer;
  }

  .overlay[hidden] { display: none; }
  .overlay {
    position: fixed; inset: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(3px);
    display: grid; place-items: center;
    padding: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px))
             max(24px, env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px));
  }
  .overlay-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 32px 28px; max-width: 340px; text-align: center;
    display: flex; flex-direction: column; gap: 12px;
    animation: pop 0.35s ease;
  }
  .overlay-card h2 {
    margin: 0; font-family: var(--font-display); font-weight: 700;
    font-size: 52px; letter-spacing: 0.02em; color: var(--accent); line-height: 1;
  }
  .overlay-card p { margin: 0; font-size: 15px; line-height: 1.5; }
  .overlay-card button {
    appearance: none; border: none; border-radius: 8px;
    background: var(--accent); color: var(--accent-fg);
    font: 600 15px var(--font-body); padding: 10px 18px; cursor: pointer;
  }
  @keyframes pop { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .overlay-card { animation: none; }
    .fill { transition: none; }
  }
</style>

    <div>
      <h1>eDNA Bingo</h1>
      <p class="lede">Can you see yourself in Australia's eDNA ecosystem? Tap everything you've had a hand in. Mark <strong><span id="goal"></span> or more</strong> and you've got bingo.</p>
    </div>
  </header>

  <div class="status">
    <div class="bar"><div class="fill" id="fill"></div></div>
    <p class="count" id="count"></p>
  </div>

  <div class="grid" id="grid" role="group" aria-label="Bingo card"></div>

  <ul class="legend" id="legend"></ul>

  <p class="foot">Everyone has the same card. Your taps stay on your phone. <button class="reset" id="reset">Clear my card</button></p>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="overlay-card" role="alertdialog" aria-labelledby="bingoTitle">
    <h2 id="bingoTitle">BINGO!</h2>
    <p id="bingoText"></p>
    <button id="closeOverlay">Keep playing</button>
  </div>
</div>

<script>
  // ---- Edit these three things only ----
  var CATEGORIES = [
    "Workflow",             // 0
    "Glue",                 // 1
    "Accelerants",          // 2
    "Problems solved",      // 3
    "Agendas & challenges", // 4
    "Horizon"               // 5
  ];
  var ITEMS = [
    ["Collected eDNA in the field", 0],
    ["Filtered water samples", 0],
    ["Extracted DNA in the lab", 0],
    ["Run qPCR or ddPCR", 0],
    ["Done metabarcoding", 0],
    ["Done the bioinformatics", 0],
    ["Used HPC or cloud compute", 0],
    ["Used a DNA reference library", 1],
    ["Added to a reference library", 1],
    ["Made eDNA data FAIR", 1],
    ["Helped write standards or guidelines", 1],
    ["SeDNAS member", 2],
    ["Been to an eDNA conference", 2],
    ["Published an eDNA paper", 2],
    ["Helped government or industry use eDNA", 2],
    ["Used a commercial eDNA service", 2],
    ["Answered a management question", 3],
    ["Monitored a marine park", 3],
    ["Worked with Traditional Owners", 4],
    ["Discussed benefit sharing", 4],
    ["Talked eDNA with a regulator", 4],
    ["Worried about the cost", 4],
    ["Gone beyond presence/absence", 5],
    ["Used autonomous samplers", 5],
    ["Applied AI or machine learning", 5]
  ];
  var BINGO_AT = 8;
  // --------------------------------------

  var KEY = "edna-bingo-marks";
  var grid = document.getElementById("grid");
  var marked = new Set();
  var celebrated = false;

  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || "[]");
    saved.forEach(function (i) { if (i >= 0 && i < ITEMS.length) marked.add(i); });
    celebrated = marked.size >= BINGO_AT;
  } catch (e) {}

  document.getElementById("goal").textContent = BINGO_AT;

  var legend = document.getElementById("legend");
  CATEGORIES.forEach(function (name, c) {
    var li = document.createElement("li");
    var dot = document.createElement("span");
    dot.className = "dot";
    dot.style.background = "var(--cat" + c + ")";
    li.appendChild(dot);
    li.appendChild(document.createTextNode(name));
    legend.appendChild(li);
  });

  ITEMS.forEach(function (entry, i) {
    var label = entry[0], cat = entry[1];
    var b = document.createElement("button");
    b.className = "cell c" + cat;
    b.type = "button";
    b.textContent = label;
    b.setAttribute("aria-pressed", marked.has(i) ? "true" : "false");
    b.addEventListener("click", function () {
      if (marked.has(i)) { marked.delete(i); } else { marked.add(i); }
      b.setAttribute("aria-pressed", marked.has(i) ? "true" : "false");
      save();
      update();
    });
    grid.appendChild(b);
  });

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(Array.from(marked))); } catch (e) {}
  }

  function update() {
    var n = marked.size;
    document.getElementById("count").textContent =
      n + " of " + ITEMS.length + " marked · bingo at " + BINGO_AT;
    document.getElementById("fill").style.width =
      Math.min(100, (n / BINGO_AT) * 100) + "%";
    if (n >= BINGO_AT && !celebrated) {
      celebrated = true;
      document.getElementById("bingoText").textContent =
        "You're part of the eDNA ecosystem, " + n + " times over. Sing out and show your screen.";
      document.getElementById("overlay").hidden = false;
    }
    if (n < BINGO_AT) celebrated = false;
  }

  document.getElementById("closeOverlay").addEventListener("click", function () {
    document.getElementById("overlay").hidden = true;
  });

  document.getElementById("reset").addEventListener("click", function () {
    marked.clear();
    celebrated = false;
    save();
    document.querySelectorAll(".cell").forEach(function (b) {
      b.setAttribute("aria-pressed", "false");
    });
    update();
  });

  update();
</script>

</body>
</html>
